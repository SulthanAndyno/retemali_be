# ─────────────────────────────────────────────────────────────────────────────
# Rete Mali — full self-hosted stack (PostgreSQL + API + web)
#
#   cp .env.example .env.production   # then edit it
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only JWT_SECRET has to be provided; DATABASE_URL defaults to the bundled
# PostgreSQL service. Point DATABASE_URL at an external/managed database to
# leave out the postgres service.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-retemali}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-retemali}"
      POSTGRES_DB: "${POSTGRES_DB:-retemali_db}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retemali} -d ${POSTGRES_DB:-retemali_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default — the API reaches it over the compose network.
    # Uncomment for a psql shell from the host.
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "5000"
      # Inside compose, PostgreSQL is reachable by service name and has no TLS.
      DATABASE_URL: "${DATABASE_URL:-postgresql://retemali:retemali@postgres:5432/retemali_db?schema=public}"
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET first - openssl rand -hex 32}"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:3000}"
    volumes:
      # Uploaded files must survive container recreation.
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-5000}:5000"
    # Migrations run before the server starts; re-running is a no-op.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BUILD-TIME: must be the public API origin the browser will call.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}"
        NEXT_PUBLIC_WHATSAPP_NUMBER: "${NEXT_PUBLIC_WHATSAPP_NUMBER:-6281234567890}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      # RUNTIME: server-side route handlers call the API over the compose network.
      API_URL: "${API_URL:-http://api:5000/api}"
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
